[package]
name = "nod"
version = "2.0.0"
edition = "2021"
authors = ["Philipp <philipp@ancoris.ovh>"]
description = "Universal Nix Orchestration & Deployment Engine"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
colored = "2.1"
ratatui = "0.26"
crossterm = "0.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
hostname = "0.4"

[dev-dependencies]
mockall = "0.13"
tempfile = "3.10"
